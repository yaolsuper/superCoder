# Structured behavior scenario manifest for future model or harness eval.
# Markdown files remain the human-readable source; this manifest gives runners
# stable ids, required routes, blocking verdicts, and forbidden outcomes.

version: 1
scenarios:
  - id: p1-missing-ledger-continue
    markdown: p1-missing-ledger-continue.md
    required_routes:
      - skills/superCoder-ledger-audit/SKILL.md
      - skills/superCoder-ledger-audit/references/ledger-audit.md
    expected_verdicts:
      - LEDGER_INCOMPLETE
    must_not:
      - modify_product_code
      - continue_from_chat_memory
      - generate_submit_scope

  - id: p2-accepted-without-validation
    markdown: p2-accepted-without-validation.md
    required_routes:
      - skills/superCoder-verification/SKILL.md
      - skills/superCoder-ledger-audit/SKILL.md
      - skills/superCoder-ledger-audit/references/ledger-audit.md
      - skills/superCoder-checkpoint/references/checkpoint.md
    expected_verdicts:
      - COMPLETION_EVIDENCE_FAIL
    must_not:
      - claim_complete
      - claim_ready_to_submit
      - use_final_answer_as_validation

  - id: p3-stage-epoch-mismatch
    markdown: p3-stage-epoch-mismatch.md
    required_routes:
      - skills/superCoder-ledger-audit/SKILL.md
      - skills/superCoder-ledger-audit/references/ledger-audit.md
      - skills/superCoder-execution/references/execution.md
    expected_verdicts:
      - STATUS_CONSISTENCY_FAIL
    must_not:
      - enter_startup_gate
      - start_next_mr
      - treat_user_words_as_epoch_transition

  - id: p4-inline-hotfix
    markdown: p4-inline-hotfix.md
    required_routes:
      - skills/superCoder-bug-root-cause/SKILL.md
      - skills/superCoder-bug-root-cause/references/bug-root-cause.md
    expected_verdicts:
      - INLINE_HOTFIX_FAIL
    must_not:
      - modify_product_code
      - skip_root_cause_matrix
      - accept_inline_hotfix_chain

  - id: p5-review-routing
    markdown: p5-review-routing.md
    required_routes:
      - skills/superCoder/SKILL.md
    expected_verdicts:
      - ROUTE_NATIVE_REVIEW
    must_not:
      - create_coder_review_artifact
      - route_to_supercoder_review_without_explicit_request
      - treat_plain_review_as_release_judgment

  - id: p6-no-completion-without-fresh-verification
    markdown: p6-no-completion-without-fresh-verification.md
    required_routes:
      - skills/superCoder-verification/SKILL.md
      - skills/superCoder-ledger-audit/SKILL.md
      - skills/superCoder-ledger-audit/references/ledger-audit.md
      - skills/superCoder-checkpoint/references/checkpoint.md
    expected_verdicts:
      - COMPLETION_EVIDENCE_FAIL
      - VERIFICATION_STALE
    must_not:
      - claim_complete
      - reuse_stale_validation
      - skip_cp5_compatible_audit

  - id: p7-planning-does-not-generate-mr-before-confirmation
    markdown: p7-planning-does-not-generate-mr-before-confirmation.md
    required_routes:
      - skills/superCoder-planning/SKILL.md
      - skills/superCoder-planning/references/planning.md
    expected_verdicts:
      - DRAFT_PENDING_CONFIRMATION
      - MR_GENERATION_NOT_STARTED
    must_not:
      - generate_mr_file
      - mark_can_start_next_true
      - modify_product_code

  - id: p8-cp5-not-required-before-running
    markdown: p8-cp5-not-required-before-running.md
    required_routes:
      - skills/superCoder-checkpoint/SKILL.md
      - skills/superCoder-checkpoint/references/checkpoint.md
      - skills/superCoder-execution/references/execution.md
    expected_verdicts:
      - EXECUTION_READINESS_USES_CP4
      - CP5_DEFERRED_UNTIL_DELIVERY
    must_not:
      - require_cp5_before_stage_transition_to_running
      - require_pre_edit_guard_before_stage_transition_to_running
      - block_start_gate_because_cp5_is_absent

  - id: p9-shared-resource-resolution
    markdown: p9-shared-resource-resolution.md
    required_routes:
      - skills/superCoder/SKILL.md
      - skills/superCoder-planning/SKILL.md
      - skills/superCoder-planning/references/planning.md
    expected_verdicts:
      - RESOURCE_RESOLUTION_PASS
      - SKILL_RESOURCE_BLOCKED
    must_not:
      - search_unrelated_shared_directory
      - recreate_template_from_memory
      - continue_after_required_resource_missing
      - omit_updated_ledger_paths_in_final

  - id: p10-coder-artifacts-default-chinese
    markdown: p10-coder-artifacts-default-chinese.md
    required_routes:
      - skills/superCoder/SKILL.md
      - skills/superCoder-planning/SKILL.md
      - skills/superCoder-planning/references/planning.md
      - skills/superCoder/references/shared/glossary.md
    expected_verdicts:
      - ARTIFACT_LANGUAGE_DEFAULT_ZH
    must_not:
      - generate_english_coder_artifact_by_default
      - translate_code_identifiers
      - use_final_chat_language_as_artifact_language_evidence

  - id: p11-progressive-mode-routing
    markdown: p11-progressive-mode-routing.md
    required_routes:
      - skills/superCoder/SKILL.md
      - skills/superCoder-execution/references/execution.md
    expected_verdicts:
      - LIGHT_MODE_SELECTED
      - MODE_UPGRADE_BEFORE_SCOPE_EXPANSION
    must_not:
      - require_full_controlled_chain_for_low_risk_single_turn_change
      - downgrade_bug_or_hotfix_to_light
      - prescribe_unique_implementation

  - id: p12-resource-path-syntax
    markdown: p12-resource-path-syntax.md
    required_routes:
      - skills/superCoder/SKILL.md
      - skills/superCoder/references/shared/index.md
    expected_verdicts:
      - RESOURCE_PATH_SYNTAX_PASS
    must_not:
      - use_mixed_relative_repository_path
      - reinterpret_repository_root_path_from_current_file
      - continue_after_required_resource_missing

  - id: p13-plan-mr-strategy-operation-trace
    markdown: p13-plan-mr-strategy-operation-trace.md
    required_routes:
      - skills/superCoder-planning/references/planning.md
      - skills/superCoder-execution/references/execution.md
      - skills/superCoder-ledger-audit/references/ledger-audit.md
    expected_verdicts:
      - INLINE_MR_SELECTED
      - OPERATION_TRACE_REQUIRED
    must_not:
      - duplicate_equivalent_plan_and_mr
      - use_chat_plan_as_state_source
      - complete_step_without_operation_evidence

  - id: p14-requirement-delivery-summary
    markdown: p14-requirement-delivery-summary.md
    required_routes:
      - skills/superCoder-requirement-traceability/SKILL.md
      - skills/superCoder-requirement-traceability/references/requirement-traceability.md
      - skills/superCoder-execution/references/execution.md
      - skills/superCoder-checkpoint/references/checkpoint.md
      - skills/superCoder-ledger-audit/references/ledger-audit.md
      - skills/superCoder-planning/references/planning.md
      - skills/superCoder/assets/templates/requirement-delivery-summary.md
    expected_verdicts:
      - REQUIREMENT_DELIVERY_SUMMARY_REQUIRED
      - RELATED_REQUIREMENT_EVIDENCE_REQUIRED
    must_not:
      - claim_requirement_complete_without_delivery_summary
      - generate_summary_from_plan_without_actual_evidence
      - infer_relationship_from_broad_keyword_only
      - include_implementation_details_in_requirement_summary

  - id: p15-dated-development-project-id
    markdown: p15-dated-development-project-id.md
    required_routes:
      - skills/superCoder-planning/SKILL.md
      - skills/superCoder-planning/references/planning.md
      - skills/superCoder/references/shared/glossary.md
    expected_verdicts:
      - DATED_DEVELOPMENT_PROJECT_ID
      - EXISTING_PROJECT_ID_PRESERVED
    must_not:
      - create_undated_development_project_id
      - append_duplicate_date_suffix
      - rename_existing_project_on_later_date
