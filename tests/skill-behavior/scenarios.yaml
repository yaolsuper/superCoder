      - MR_GENERATION_NOT_STARTED
    must_not:
      - generate_mr_file
      - mark_can_start_next_true
      - modify_product_code

  - id: p8-cp5-not-required-before-running
    markdown: p8-cp5-not-required-before-running.md
    required_routes:
