schema_version: "supercoder.human-confirmation-gate/v1"

states:
  ANALYZING:
    allowed_actions:
      - READ_CONTEXT
      - TARGETED_EVIDENCE_SCAN
      - WRITE_ANALYSIS_ARTIFACTS
    forbidden_actions:
      - GENERATE_PLAN
      - MODIFY_PRODUCT_CODE
      - INVOKE_EXECUTION_SKILL
  BLOCKED_HUMAN_CONFIRMATION:
    allowed_actions:
      - READ_CONTEXT
      - CONTINUE_TARGETED_EVIDENCE_SCAN
      - DISPLAY_BLOCKING_QUESTIONS
      - ACCEPT_EXPLICIT_HUMAN_ANSWER
      - CANCEL_TASK
    forbidden_actions:
      - GENERATE_PLAN
      - GENERATE_MR
      - MODIFY_PRODUCT_CODE
      - RUN_MIGRATION
      - DEPLOY
      - GENERATE_SUBMIT_SCOPE
      - INVOKE_EXECUTION_SKILL
  HUMAN_INPUT_RECEIVED:
    allowed_actions:
      - VALIDATE_HUMAN_ANSWER
      - PERSIST_DECISION
      - RETURN_TO_ANALYZING
    forbidden_actions:
      - GENERATE_PLAN
      - MODIFY_PRODUCT_CODE
      - INVOKE_EXECUTION_SKILL
  ANALYSIS_READY:
    allowed_actions:
      - INVOKE_PLANNING_SKILL
    forbidden_actions:
      - MODIFY_PRODUCT_CODE

transitions:
  - from: ANALYZING
    to: BLOCKED_HUMAN_CONFIRMATION
    when: unresolved_blocking_question_count_gt_zero
  - from: ANALYZING
    to: ANALYSIS_READY
    when: analysis_gate_passed
  - from: BLOCKED_HUMAN_CONFIRMATION
    to: HUMAN_INPUT_RECEIVED
    when: explicit_human_answer_received
  - from: HUMAN_INPUT_RECEIVED
    to: ANALYZING
    when: answer_persisted_as_decision

forbidden_transitions:
  - from: ANALYZING
    to: EXECUTING
  - from: BLOCKED_HUMAN_CONFIRMATION
    to: PLANNING
  - from: BLOCKED_HUMAN_CONFIRMATION
    to: EXECUTING
  - from: HUMAN_INPUT_RECEIVED
    to: PLANNING
  - from: HUMAN_INPUT_RECEIVED
    to: EXECUTING

analysis_gate:
  pass_when_all:
    - evidence_scan_status_is_completed
    - evidence_scan_coverage_is_sufficient
    - unresolved_blocking_question_count_is_zero
    - unresolved_critical_assumption_count_is_zero
    - every_resolved_fact_has_source_point
  fail_when_any:
    - evidence_scan_status_is_not_completed
    - evidence_scan_coverage_is_incomplete
    - blocking_question_without_source_point_or_evidence_gap
    - unresolved_blocking_question_count_gt_zero
    - unresolved_high_risk_evidence_conflict
    - acceptance_criteria_not_determinable

question_classes:
  BLOCKING: blocks_planning_and_execution
  NON_BLOCKING: records_reversible_safe_default
  INFORMATIONAL: records_without_current_stage_effect
  INVALID: continue_system_investigation

answer_policy:
  accepted_source: EXPLICIT_HUMAN_ANSWER
  infer_from_silence: false
  accept_ambiguous_language: false
  direct_transition_to_planning: false
  resume_state: ANALYZING
