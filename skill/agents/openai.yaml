interface:
  display_name: "superCoder v2.0"
  short_description: "通用开发执行协议；任何读代码分析、改代码、修复、测试验证、检查未提交更改、代码审查、MR 推进、生成本次需求 git add/提交范围都应触发"
  default_prompt: "使用 superCoder v2.0 执行开发任务。维护 superCoder 本身时不套研发执行流程。开发类任务预判闸门：只要用户请求会导致读取工程代码、结合当前系统实现分析、判断实现方案、修改产品代码、运行测试、审查 diff、检查未提交更改、推进 MR、生成本次需求相关 git add/提交范围，都必须先使用 superCoder；用户不必显式点名 superCoder。若普通分析过程中准备改代码、跑验证、输出提交范围或审查当前 diff，必须先切换到本 Skill 的对应协议。普通分析、迁移评估、实施计划或 MR 拆分读取 references/protocols/planning.md；代码审查、检查未提交更改和质量审核读取 references/protocols/review.md；编码执行、继续修复和运行验证读取 references/protocols/execution.md；专项复核读取 references/protocols/checkpoint.md；场景化文档 Review 读取 references/document-review-checklist.md。项目内 Markdown 文件是唯一可恢复状态源；IDE TODO、update_plan、聊天记录和模型记忆不能替代 .coder/<development_project_id>/ 下的状态回写。阶段转换（计划确认、开始执行、进入下一 MR）必须以 coder-current-task.md / project-progress.md / checkpoint-status.md 三文件 stage_epoch 同步跳变为唯一证据；无 epoch 跳变不得声称阶段已变，不得据此修改产品代码。修改产品代码前必须通过 pre-edit guard：当前阶段 == RUNNING、三文件 stage_epoch 一致、source_chain.plan/mr 文件真实存在、路径守卫通过、CP4 无 Blocker。用户口头指令不得直接升级阶段；含糊指令（继续/接着做）在等待确认态只能原地或请求澄清；阶段升级需可升级态 + stage_epoch 写入 + 触发词明确三者同时满足。正式编码必须具备 analysis -> implementation plan -> detailed MR -> coder-current-task -> execution 链路；缺少 plan 或 MR 时不得修改产品代码。BUG/缺陷/回归修复任务同样必须走完整 analysis(根因证据矩阵) -> plan -> fix-mr 链路，不得因改动小跳过 plan 或 fix-mr，不得用空壳 plan/mr 糊弄 pre-edit guard；BUG 场景的 pre-edit guard 校验根因证据矩阵（故障现象/复现/根因 file:line/修复范围/回归验证）齐全。跨模型、跨轮次、上下文压缩后继续，或用户说继续/实施开发/直到完成时，必须先从 coder-current-task.md、project-progress.md、checkpoint-status.md、handoff.md、task-state.md、当前 MR 和相关 Review 恢复状态（并校验 stage_epoch 一致），不能依赖上一模型对话记忆。实施计划默认先待确认，确认前不得生成独立 MR 文件或进入 READY。每轮正式产物必须维护 project-progress.md、checkpoint-status.md、handoff.md、task-state.md、reviews/*.md；修改产品代码还必须维护 records/*-execution-record.md、validation/*-validation.md，并回写当前 MR 文件执行清单。最终回复声明完成前必须通过验证门禁、CP5 和状态一致性锁。所有文件读取、日志、diff 和命令输出必须有界过滤。详细规则以 SKILL.md 和 references/ 为准。"
