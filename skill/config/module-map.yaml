# superCoder module map for package maintenance checks.
# This file is not a runtime project configuration.

modules:
  - id: entry
    routed_by_skill: true
    files:
      - "SKILL.md"
      - "agents/openai.yaml"
      - "references/index.md"
      - "references/glossary.md"
      - "config/coder-config-example.yaml"
      - "config/module-map.yaml"

  - id: planning
    routed_by_skill: true
    files:
      - "references/protocols/planning.md"
      - "references/protocols/checkpoint.md"
      - "references/document-review-checklist.md"
      - "assets/templates/gates.md"
      - "assets/templates/progress-overview.md"
      - "assets/templates/task-and-mr.md"

  - id: review
    routed_by_skill: true
    files:
      - "references/protocols/review.md"
      - "references/protocols/checkpoint.md"
      - "references/document-review-checklist.md"
      - "references/prompts/reviewer.md"

  - id: execution
    routed_by_skill: true
    files:
      - "references/protocols/execution.md"
      - "references/protocols/checkpoint.md"
      - "assets/templates/gates.md"
      - "assets/templates/progress-overview.md"
      - "assets/templates/task-and-mr.md"
      - "references/guides/error-recovery.md"
      - "references/guides/cicd-integration.md"

  - id: checkpoint
    routed_by_skill: true
    files:
      - "references/protocols/checkpoint.md"
      - "references/document-review-checklist.md"
      - "references/prompts/generator.md"
      - "references/prompts/reviewer.md"
      - "references/prompts/fixer.md"

  - id: document_review
    routed_by_skill: true
    files:
      - "references/document-review-checklist.md"
      - "references/protocols/review.md"
      - "references/protocols/checkpoint.md"

  - id: prompts
    routed_by_skill: true
    files:
      - "references/prompts/generator.md"
      - "references/prompts/reviewer.md"
      - "references/prompts/fixer.md"

  - id: templates
    routed_by_skill: true
    files:
      - "assets/templates/gates.md"
      - "assets/templates/index.md"
      - "assets/templates/progress-overview.md"
      - "assets/templates/task-and-mr.md"

  - id: guides
    routed_by_skill: true
    files:
      - "assets/examples/protocol-examples.md"
      - "references/guides/error-recovery.md"
      - "references/guides/cicd-integration.md"
      - "references/guides/migration.md"

  - id: manifest
    routed_by_skill: false
    files:
      - "config/module-map.yaml"
      - "references/index.md"
